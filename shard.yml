name: grapheme_cell_width
version: 0.2.0

authors:
  - shpeckman <geelenrobin@proton.me>

description: |
  Grapheme-cluster-based terminal cell-width measurement for clean text
  spans. Feed it spans of plain UTF-8 text (no ANSI escapes, no control
  characters) and get back the width of each span in terminal cells, or
  stream zero-copy grapheme clusters with their widths.
  Zero dependencies, zero allocations, wcwidth-compatible.

crystal: ">= 1.10.0"

scripts:
  postinstall: make gen-tables

